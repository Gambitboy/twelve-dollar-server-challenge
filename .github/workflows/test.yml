# Runs every submission a pull request adds or changes through test/run.sh on a clean Ubuntu 24.04.
name: test submissions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-24.04
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: dirs
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          # a change outside submissions/ (spec, tests, seed) re-tests the reference
          dirs=$(echo "$changed" | awk -F/ '$1=="submissions" && NF>2 {print $1"/"$2; next} NF {print "submissions/go-net-http"}' | sort -u | while read -r d; do [ -d "$d" ] && echo "$d"; done)
          echo "dirs=$(echo "$dirs" | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"
          echo "testing: $dirs"

  test:
    needs: find
    if: needs.find.outputs.dirs != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.find.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3 jq curl openssl
      - name: seed
        run: bash seed/make-seed.sh
      - name: install.sh
        run: sudo bash ${{ matrix.dir }}/install.sh
      - name: build, start, test
        run: bash test/run.sh ${{ matrix.dir }}
